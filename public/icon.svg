<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#070B19" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="50%" stop-color="#9333EA" />
      <stop offset="100%" stop-color="#6B21A8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded shield -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="url(#goldGrad)" stroke-width="6" opacity="0.8" />

  <!-- Outer Neon Ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#purpleGrad)" stroke-width="8" opacity="0.4" />

  <!-- Central Shield Emblem -->
  <path d="M 256 90 L 390 145 L 350 330 L 256 425 L 162 330 L 122 145 Z" fill="#0C132E" stroke="url(#goldGrad)" stroke-width="10" filter="url(#glow)" />

  <!-- Crown inside Shield -->
  <path d="M 195 285 L 180 200 L 225 240 L 256 165 L 287 240 L 332 200 L 317 285 Z" fill="url(#goldGrad)" />

  <!-- Central Letters "CE" -->
  <text x="256" y="365" font-family="'Orbitron', sans-serif, system-ui" font-weight="900" font-size="58" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">
    CLASH
  </text>
  <text x="256" y="405" font-family="'Orbitron', sans-serif, system-ui" font-weight="800" font-size="28" fill="#F59E0B" text-anchor="middle" letter-spacing="8">
    ELITES
  </text>
</svg>
